name: Public source check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public source boundary
        run: python scripts/check_public_source.py
      - name: Compile local toolkit sources
        run: python -m compileall -q ai_studio_launcher.py video_faceswap_pipeline.py watermark_tools
